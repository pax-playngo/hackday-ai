<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lock In Timer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --fg: #000;
      --muted: #555;
    }

    * {
      box-sizing: border-box;
      font-family: "Arial", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
    }

    .timer-card {
      width: min(92vw, 420px);
      border: 3px solid var(--fg);
      border-radius: 20px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 8px 8px 0 var(--fg);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.6rem;
      letter-spacing: 0.04em;
    }

    .theme-icon {
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .task-row {
      display: grid;
      gap: 0.5rem;
      margin-bottom: 1rem;
      text-align: left;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      border: 2px solid var(--fg);
      border-radius: 10px;
      padding: 0.6rem 0.75rem;
      font-size: 1rem;
    }

    .time {
      margin: 0.8rem 0 1.2rem;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .task-status {
      min-height: 1.2rem;
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .circle-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--fg);
      background: var(--bg);
      color: var(--fg);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .circle-btn:active {
      transform: scale(0.97);
    }

    .circle-btn.running {
      background: var(--fg);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <main class="timer-card">
    <div class="theme-icon" aria-hidden="true">🔒🗝️</div>
    <h1>Lock In Timer</h1>

    <div class="task-row">
      <label for="taskInput">Task</label>
      <input id="taskInput" type="text" placeholder="What are you working on?" maxlength="80" />
    </div>

    <p id="taskStatus" class="task-status">No task in focus</p>
    <p id="timeDisplay" class="time" aria-live="polite">00:00:00</p>

    <button id="toggleButton" class="circle-btn" type="button" aria-pressed="false">START</button>
  </main>

  <script>
    const toggleButton = document.getElementById("toggleButton");
    const timeDisplay = document.getElementById("timeDisplay");
    const taskInput = document.getElementById("taskInput");
    const taskStatus = document.getElementById("taskStatus");

    let timerId = null;
    let startTime = null;
    let elapsedMs = 0;

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}`;
    }

    function renderTime() {
      const currentElapsed = startTime ? elapsedMs + (Date.now() - startTime) : elapsedMs;
      timeDisplay.textContent = formatTime(currentElapsed);
    }

    function updateTaskStatus() {
      const taskName = taskInput.value.trim();
      taskStatus.textContent = taskName ? `Focused on: ${taskName}` : "No task in focus";
    }

    function startTimer() {
      startTime = Date.now();
      toggleButton.textContent = "STOP";
      toggleButton.classList.add("running");
      toggleButton.setAttribute("aria-pressed", "true");
      updateTaskStatus();
      renderTime();
      timerId = setInterval(renderTime, 250);
    }

    function stopTimer() {
      if (startTime) {
        elapsedMs += Date.now() - startTime;
      }
      startTime = null;
      clearInterval(timerId);
      timerId = null;
      renderTime();
      toggleButton.textContent = "START";
      toggleButton.classList.remove("running");
      toggleButton.setAttribute("aria-pressed", "false");
    }

    toggleButton.addEventListener("click", () => {
      if (timerId) {
        stopTimer();
      } else {
        startTimer();
      }
    });

    taskInput.addEventListener("input", updateTaskStatus);
  </script>
</body>
</html>
